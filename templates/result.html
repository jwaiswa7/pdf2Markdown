<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Converted Markdown</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      padding: 2rem 1rem;
      color: #222;
    }

    .toolbar {
      max-width: 860px;
      margin: 0 auto 1.2rem;
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .toolbar a, .toolbar button {
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: .55rem 1.1rem;
      font-size: .9rem;
      cursor: pointer;
      text-decoration: none;
      transition: background .2s;
    }
    .toolbar a:hover, .toolbar button:hover { background: #357abd; }
    .toolbar button.secondary {
      background: #fff; color: #4a90e2;
      border: 1.5px solid #4a90e2;
    }
    .toolbar button.secondary:hover { background: #f0f6ff; }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      max-width: 860px;
      margin: 0 auto;
      padding: 2.5rem 2.5rem;
    }

    /* Rendered markdown styles */
    .md-body h1, .md-body h2, .md-body h3,
    .md-body h4, .md-body h5, .md-body h6 {
      margin: 1.4rem 0 .6rem; line-height: 1.3;
    }
    .md-body p { margin: .75rem 0; line-height: 1.7; }
    .md-body ul, .md-body ol { margin: .75rem 0 .75rem 1.5rem; line-height: 1.7; }
    .md-body a { color: #4a90e2; }
    .md-body code {
      background: #f1f3f5; border-radius: 4px;
      padding: .1em .4em; font-size: .9em;
    }
    .md-body pre {
      background: #f1f3f5; border-radius: 7px;
      padding: 1rem; overflow-x: auto; margin: 1rem 0;
    }
    .md-body pre code { background: none; padding: 0; }
    .md-body table {
      border-collapse: collapse; width: 100%; margin: 1rem 0;
    }
    .md-body th, .md-body td {
      border: 1px solid #dee2e6; padding: .5rem .75rem;
    }
    .md-body th { background: #f8f9fa; }
    .md-body blockquote {
      border-left: 4px solid #dee2e6; color: #666;
      padding-left: 1rem; margin: 1rem 0;
    }
    .md-body img { max-width: 100%; }

    /* Raw markdown panel (hidden by default) */
    #raw-panel {
      display: none;
      background: #f8f9fa;
      border-radius: 8px;
      padding: 1.5rem;
      font-family: "Fira Mono", "Consolas", monospace;
      font-size: .85rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 70vh;
      overflow-y: auto;
    }

    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: #222; color: #fff;
      border-radius: 7px; padding: .6rem 1.1rem;
      font-size: .9rem; opacity: 0; pointer-events: none;
      transition: opacity .3s;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="/">⬅ Convert another PDF</a>
    <button class="secondary" id="toggle-raw-btn" onclick="toggleRaw()">Show Raw Markdown</button>
    <button class="secondary" onclick="copyMd()">📋 Copy Markdown</button>
    <button class="secondary" onclick="downloadMd()">⬇ Download .md</button>
  </div>

  <div class="card">
    <div class="md-body" id="rendered-panel">{{ html_body | safe }}</div>
    <pre id="raw-panel">{{ md_text }}</pre>
  </div>

  <div class="toast" id="toast">Copied!</div>

  <script>
    const mdText = {{ md_text | tojson }};
    let rawVisible = false;

    function toggleRaw() {
      rawVisible = !rawVisible;
      document.getElementById("raw-panel").style.display = rawVisible ? "block" : "none";
      document.getElementById("rendered-panel").style.display = rawVisible ? "none" : "block";
      document.getElementById("toggle-raw-btn").textContent = rawVisible ? "Show Rendered" : "Show Raw Markdown";
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2000);
    }

    function copyMd() {
      navigator.clipboard.writeText(mdText).then(() => showToast("Copied!"));
    }

    function downloadMd() {
      const blob = new Blob([mdText], { type: "text/markdown" });
      const a = Object.assign(document.createElement("a"), {
        href: URL.createObjectURL(blob),
        download: "converted.md"
      });
      a.click();
    }
  </script>
</body>
</html>
